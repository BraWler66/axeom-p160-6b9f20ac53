<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0e0b" media="(prefers-color-scheme: dark)">
<title>Axeom Today</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316140f'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f6f3ec' font-family='Georgia' font-style='italic'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader" class="loader" role="status" aria-live="polite">
  <div class="book" aria-hidden="true">
    <i class="cover"></i><i class="pg"></i><i class="pg"></i><i class="pg"></i>
  </div>
  <div class="l-title">Reading your day</div>
  <div class="l-step mono" id="lstep">reading 8 files…</div>
  <div class="l-track" aria-hidden="true"><i id="lbar"></i></div>
</div>

<header class="top">
  <div class="mark"><span class="logo serif">A</span><span class="mono" id="asof">&nbsp;</span></div>
  <button class="add" id="uploadBtn" type="button">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    Add new files
  </button>
  <input type="file" id="fileInput" multiple accept=".csv,.txt,text/csv,text/plain" hidden>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Main">
  <i class="pill" id="pill" aria-hidden="true"></i>
  <button data-tab="today" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
  <button data-tab="money"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg><span>Money</span><b id="badge-money"></b></button>
  <button data-tab="edits"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg><span>Edits</span><b id="badge-edits"></b></button>
  <button data-tab="leads"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg><span>Leads</span><b id="badge-leads"></b></button>
  <button data-tab="clients"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>Clients</span></button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" hidden></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
