<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Axeom Today</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">A</div>
    <div>
      <div class="brand-name">Axeom</div>
      <div class="asof" id="asof">Loading…</div>
    </div>
  </div>
  <button class="upload-btn" id="uploadBtn" type="button" aria-label="Add new files">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11 16V7.8l-2.6 2.6L7 9l5-5 5 5-1.4 1.4L13 7.8V16h-2zm-6 4v-5h2v3h10v-3h2v5H5z"/></svg>
    Add new files
  </button>
  <input type="file" id="fileInput" multiple accept=".csv,.txt,text/csv,text/plain" hidden>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><span>Today</span></button>
  <button data-tab="money"><span>Money</span><b id="badge-money"></b></button>
  <button data-tab="edits"><span>Edits</span><b id="badge-edits"></b></button>
  <button data-tab="leads"><span>Leads</span><b id="badge-leads"></b></button>
  <button data-tab="clients"><span>Clients</span></button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
<div class="toast" id="toast" hidden></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
